{% extends "base.html" %}

{% block title %}Ошибка {{ status_code }}{% endblock %}

{% block content %}
<div class="error-wrap">
  <div class="card">
    <div class="error-code">{{ status_code }}</div>
    <h1>Не получилось открыть страницу</h1>
    <p>{{ detail }}</p>
    <a class="btn" href="/">На главную</a>
  </div>
</div>
{% endblock %}

services:
  medu-lab:
    build: .
    restart: unless-stopped
    environment:
      # Обязательно задайте свои значения (в Coolify — во вкладке Environment Variables)
      TEACHER_PASSWORD: ${TEACHER_PASSWORD:?задайте пароль учителя}
      SECRET_KEY: ${SECRET_KEY:?задайте случайный ключ подписи cookie}
      SCHOOL_NAME: ${SCHOOL_NAME:-Школа №1409}
      LAB_NAME: ${LAB_NAME:-Лаборатория Promobot M Edu}
      DATA_DIR: /data
      # Реестр роботов. Можно не задавать: значения по умолчанию уже в коде,
      # а после первой правки в админке реестр хранится в томе /data/robots.json
      ROBOTS_JSON: ${ROBOTS_JSON:-}
      STATUS_POLL_INTERVAL: ${STATUS_POLL_INTERVAL:-12}
      CAMERA_HOST: ${CAMERA_HOST:-}
      CAMERA_USER: ${CAMERA_USER:-}
      CAMERA_PASSWORD: ${CAMERA_PASSWORD:-}
      CAMERA_PORT: ${CAMERA_PORT:-554}
      CAMERA_PATH: ${CAMERA_PATH:-/stream2}
      CAMERA_RTSP_URL: ${CAMERA_RTSP_URL:-}
    volumes:
      - medu-data:/data
    # Не публикуем порт на хост: Coolify/Traefik ходят по внутренней сети.
    # Локально без Coolify добавьте: ports: ["80:80"]
    expose:
      - "80"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:80/health', timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  medu-data:
